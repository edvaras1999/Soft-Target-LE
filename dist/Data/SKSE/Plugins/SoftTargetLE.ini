; SoftTarget LE v0.15.1 - settings
; Most options can be changed in-game: MCM > SoftTarget. Edit by hand only for what the menu lacks.
; After editing by hand, the file is re-read by itself within a second.

[SoftTarget]
Enabled=1
LogOnly=0
Verbose=0
Probe=0

; ---------------------------------------------------------------- Lock-On (replaces Simple Lock-On: do not use both)
LockEnabled=1
; Keys: keyboard scan codes (33 = F). Mouse buttons are 256 + button (258 = M3, the middle button).
LockKey=33
LockSwitchKey=258
; How far a target can be locked and followed
LockRange=2000
; The enemy whose body (any bone: head, legs, wings, tail) is closest to the crosshair is locked,
; as long as it is within this many degrees of the crosshair
LockAcquireDegrees=30
LockHostileOnly=1
; The lock turns off when the target stays out of view (further than LockLoseAngleDegrees from the screen center) this long
LockLoseSightMs=1500
LockLoseAngleDegrees=75
; When the target dies, go to the nearest enemy
LockAutoNext=1
; 1 = the automatic choice (next enemy when the target dies) only picks enemies that are in combat. The manual lock (F) still takes whatever is at the screen center.
LockAutoCombatOnly=1
; Automatic choice (auto-next, nearest enemy): anyone inside LockAutoCircleRange counts in ANY direction (even behind you);
; further away, up to LockRange, only enemies inside the forward cone (LockAutoConeDegrees = degrees to EACH side of the screen center)
LockAutoCircleRange=900
LockAutoConeDegrees=60
; Which axis of the camera matrix points forward (0..11). 1 = Y column, confirmed in the logs. Do not change unless the lock aims wrongly.
LockCameraAxis=1
; The camera follows the target (both profiles; in the FreeCam / Coeus profile through the camera offset)
LockCameraFollow=0
; FreeCam / Coeus profile: while a bow/crossbow is drawn with the lock on, the camera centers the target (so AIM Fix arrows hit). 1 = on.
BowLockCamera=1
LockCameraPitch=1
LockCameraSmooth=5
; Camera stability (normal profile): the aim point is averaged over this many milliseconds, so the target's weapon swings and arm
; movements do not shake the camera. 0 = off. Higher = steadier but slower to follow.
AimFilterMs=600
; Dead zone, in degrees: the camera ignores errors smaller than this (0 = off).
CameraDeadZoneDegrees=3.5

; ---------------------------------------------------------------- Where SoftTarget works (0.13.2)
; 1 = no automatic body turning in first person (aim fully manual; the lock-on still works if you turn it on).
NoSoftTargetFirstPerson=1
; 1 = no automatic body turning with a bow / crossbow (the game camera is used; the lock-on still works if you turn it on).
NoSoftTargetBow=1

; ---------------------------------------------------------------- View with the lock (FreeCam profile, first person and bow in hand) (0.14.1)
; 2 = HARD: the camera stays on the target and the mouse is blocked. You move freely and M1/M2 turn the body, so there is
;     nothing to adjust when you shoot (no fight with the camera).
; 1 = SOFT: the mouse is free; when you attack (M1/M2) the lock takes full control of the view.
; 0 = off (older behaviour).
LockViewMode=2
; While this key is held the view is free (the lock stays on); on release the view eases back to the target. 42 = Shift (also sprint). 0 = none.
LockFreeLookKey=42
; Soft mode: after a mouse move the pull stays at zero this long (ms), then rises back over LockMouseRampMs (ms).
; The ramp also times the return to the target after the free look key is released.
LockMouseYieldMs=150
LockMouseRampMs=400
; Soft mode / return phase: pull smoothness, speed limit (deg/s) and dead zone (deg).
LockSoftSmooth=6
LockSoftSpeedDegPerSec=240
LockSoftDeadZoneDegrees=0.6

; ---------------------------------------------------------------- Animation mods: DMK compatibility (0.15.0)
; 1 = publishes the player animation variables used by packs made for Directional Movement Keys (OAR conditions):
;   DirecionalCycleMoveset (0 idle, 1 forward, 2 forward-right, 3 right, 4 back-right, 5 back, 6 back-left, 7 left, 8 forward-left, 9 forward+back, 10 left+right, 11-14 three keys)
;   CameraMovementCMF (1-8 like above, from the mouse movement)
; The direction is relative to the body (follows the FreeCam profile movement). Needs SoftTarget_BDI.json in SKSE/Plugins/BehaviorDataInjector. Skyrim LE 1.9.32 only.
; Do not use together with another DMK. Default 0.
DmkCompat=0
; 1 = mascara Keytrace: pacotes DAR/OAR que testam HasMagicEffect("Keytrace.esp") passam a ver a direcao do movimento (usa o Keytrace.esp minimo do SoftTarget, sem habilidades). Nao precisa de DmkCompat. Default 1.
DmkKeytrace=1
; 1 = ao sair da 1a pessoa (sem lock nem arco) o corpo volta ao nivel em ~350 ms. Default 1.
LevelPosture=1

; ---------------------------------------------------------------- 0.18.0
; 1 = the on-screen dot uses the game's own camera projection (exact position). 0 = estimate from the FOV (old behaviour). Default 1.
DotExactProject=1
; 1 = SoftTarget does not touch body/camera while the game engine controls the player (cutscenes, scripted scenes, furniture). Default 1.
AiDrivenGuard=1
; 1 = does not pick targets without line of sight (behind walls). Default 1.
RequireLineOfSight=1
; 1 = a target that is already locked stays locked while it is bleeding out / downed (until it really dies). Default 1.
KeepBleedoutTarget=1

; ---------------------------------------------------------------- Bow camera (both profiles)
; OFF by default (so it does not clash with other bow camera mods). When on: while you draw a bow / crossbow the camera moves to the shoulder (third-person shooter style) and goes back when you release.
BowShoulder=0
; 1 = right shoulder, 0 = left. The swap key (below) changes it while drawing and saves it here.
BowShoulderRight=1
; Sideways offset (0..120), forward (+) / back (-) and height, added to your normal camera offsets (game units).
BowShoulderX=40
BowShoulderY=0
BowShoulderZ=10
; Key that swaps shoulder while the bow is drawn (18 = E; 0 = none). Note: E is also the default Activate key.
BowShoulderSwapKey=18

; ---------------------------------------------------------------- Aim point height (lock-on and SoftTarget)
; Humans are aimed at the chest bone (stable); creatures at the middle of the body. This adds a manual adjustment, in game units (-60..60).
; In combat (lock-on or SoftTarget active): Shift + mouse wheel up/down changes it by 3 units per notch (it is saved here automatically).
; If the wheel also zooms the camera, use the keys below instead (Page Up / Page Down; 0 = unused).
AimHeightAdjust=0
AimAdjustWheel=1
AimAdjustUpKey=201
AimAdjustDownKey=209

; ---------------------------------------------------------------- Shot prediction (only with the lock-on)
PredictEnabled=1
; 1 = com o arco equipado e o lock ligado a previsao ja esta ativa (a camera segue o ponto previsto antes de puxar). 0 = so com a corda puxada.
PredictAlways=1
; 1 = em 3a pessoa com o lock ligado a cabeca/corpo olham sempre para o alvo (qualquer arma). 0 = so com arco/magia.
LockTiltAlways=1
; Bow / crossbow arrow speed used to compute the lead (units per second). Spells use the speed in the game data (UseSpellDataSpeed=1)
; or SpellProjectileSpeed if the game data has none.
ProjectileSpeed=9000
SpellProjectileSpeed=2500
UseSpellDataSpeed=1
; Fine tuning of all projectile speeds, %. Shots land BEHIND a moving target -> lower it; land IN FRONT of it -> raise it.
ProjectileSpeedScale=100
; Raises the aim to compensate for the drop at long distance. 0 = no compensation (arrows that fly straight). Default 0 since 0.18.2.
ProjectileGravity=0
PredictStrength=100
PredictMinDistance=150

; ---------------------------------------------------------------- SoftTarget (body follows the nearest enemy while you attack)
RequireCombat=1
UseHostileList=1
; Shape: 0 = cone in front, 1 = circle (360)
Shape=1
Range=450
ConeDegrees=140
MaxHeightDifference=600
SwitchMarginPercent=20

; Body turning
TurnSpeedDegPerSec=900
Smoothing=15
UpdateMilliseconds=1
TapAssist=1
; HoldFaceButton: 0 off, 1 left (M2), 2 right (M1), 3 both
HoldFaceButton=3
RetargetMilliseconds=80
; HoldMilliseconds: keep facing after an attack (ms)
HoldMilliseconds=3000
ReturnToHeading=0
ReturnSpeedDegPerSec=360
ReturnSmoothing=3
; FreeCam / Coeus profile: attacks turn the body toward the enemy for this long (ms) while walking, 0 = never
AttackPulseMs=350

; ProfileMode: 0 = normal (Coeus off, or Coeus with EnableUnsheathed=0), 1 = FreeCam / Coeus (Coeus directional movement with weapons drawn, EnableUnsheathed=1)
ProfileMode=1
; Accept enemies in the reanimate life state
AllowReanimated=1

; External lock-on (LockOn.dll), only if you still use it: 0 pause SoftTarget while locked on, 1 body only, 2 pause + switch to the nearest
LockOnKey=0
LockOnMode=0
LockOnSwitchKey=0
; CoeusYield: no longer used (0.12.3). In the FreeCam / Coeus profile Coeus is never asked to let go: that also released the free camera.
CoeusYield=0
; FreeCam / Coeus profile, input rotation: the body keeps facing the target (lock-on or SoftTarget) while you walk, and the walking
; direction stays relative to the SCREEN (W = up on the screen, A = left, ...). Keyboard only. The plugin finds the game's movement
; vector when you ask it to (Shift+F10, or the button in the menu: then press W, A, S, D one at a time). 0 = off.
MoveRemap=1
; First place found by the learning (kept for reference; the full list is MoveVecList below).
MoveVecRegion=0
MoveVecOffset=20
; Written by the learning (several places can hold the same vector). Format region:offset:swapped,...  Empty = not learned yet.
MoveVecList=0:20:0
; Learning: press Shift + this key (68 = F10) or the button in the menu, then press W, A, S, D one at a time for ~15 s.
MoveLearnKey=68
; (The plugin saves the two values above by itself once it finds the vector with no doubt. To search again, set MoveVecRegion=-1.)
; FreeCam / Coeus profile: sprinting does not release the aim or the lock-on (sprint attacks). 0 = sprinting ends the SoftTarget.
SprintKeepsAim=1
; Normal profile, lock-on camera: where the target sits relative to the crosshair, in degrees (-20..20). For mods that move the aim point
; (AIM FIX, camera offset). X > 0 = target to the right of the centre, Y > 0 = above the centre. 0 = centred.
AimOffsetX=0
AimOffsetY=0
; FreeCam / Coeus profile: when this mod turns the body, the camera stays still (camera offset compensated) and the mouse keeps moving only the camera
CameraHoldTdm=1
; Create the handle of targets the game does not list as hostile (Coeus needs it for its external lock-on query). Set 0 if the game crashes at the first lock.
CreateHandles=1

; Vertical aim (spells and melee): 0 off, 1 tilt the body only (the camera is not touched by this option)
VerticalMode=1
AimHeight=100
PlayerAimHeight=110
VerticalInvert=0
VerticalLimitDegrees=45

; Extra buttons (keyboard scan codes, comma separated, up to 8)
; ExtraTapKeys: R - charged attack mod
ExtraTapKeys=19
; ExtraHoldKeys: X - dual-wield block mod
ExtraHoldKeys=45

; Menu language: 0 = English, 1 = Portugues
Language=0

; Keys that count as Shift (sprinting with the lock-on does not pull the body toward the target), keyboard scan codes: 42 = left Shift, 54 = right Shift
ShiftKeys=42,54

; ---------------------------------------------------------------- On-screen indicator (dot)
DotLock=1
DotSoftTarget=1
; DotSkin: 0 = dot, 1 = ring and dot (both drawn by the plugin), 2 = Simple Lock-On reticle (LockOnReticle.swf or LockOnMenu.swf in Data\Interface),
;          3 = Coeus-style reticle (TDM_Widgets.swf + TDM_Assets0.swf in Data\Interface or Data\Interface\TrueDirectionalMovement)
DotSkin=3
; DotColor (drawn skins): 0 white, 1 red, 2 yellow, 3 cyan, 4 green, 5 orange
DotColor=0
DotSize=100
DotOpacity=100
DotTdmType=1

; ---------------------------------------------------------------- 0.18.2
; After releasing the bow the "drawing" behaviour (body and camera following the aim point) stays for this many ms, so the aim does not jump
; to the right when the arrow leaves. 0 = off. Default 400.
BowReleaseTailMs=400
; The lock key waits up to this many ms for the first line-of-sight result (so it does not slip to a target behind a wall). Default 40.
LosWaitMs=40
; A target seen less than this many ms ago is never treated as blocked (slopes, trees, uneven ground). Default 1500.
LosGraceMs=1500
; 1 = when the target is far above/below (slopes) only the horizontal difference counts to acquire and to keep the lock. Default 1.
LockVerticalForgive=1
; 1 = with the lock on, running (Shift) lets the body follow the keys you press (away from the target, sideways); on release it turns back to the target.
; W stays "forward in the view", so sprint attacks keep working. Default 1.
SprintFreeBody=1
; 1 = a bow with no arrows equipped does not count as aiming (M1 no longer turns the body toward the target). Default 1.
NoAmmoGuard=1
; 1 = limits how far up the third-person camera can look while the lock is on (avoids the camera going to the ground / first person). Default 1.
LockCamLimit=1
LockCamUpDegrees=40

; ---------------------------------------------------------------- 0.19.0
; 1 = environment sensors (ground, slope, obstacles in front, walls, ledge): writes "env:" lines to the log and, if SoftTargetEnv.esp is active,
; the RaySense-style globals. Out of combat, 10 times per second. It turns itself off if anything goes wrong. Default 1.
EnvProbe=1

; ---------------------------------------------------------------- 0.20.0
; ST_JumpObstacle (global of SoftTargetEnv.esp): 1 while a jump that started with an obstacle at least JumpObstacleMin high in front lasts
; (2 when the obstacle is 200+ and you are moving). Used by the fall/land animations of the jumping pack. Default 1.
EnvJumpObstacle=1
; Minimum obstacle height (game units) for ST_JumpObstacle (RaySense uses 66). Range 20-200.
JumpObstacleMin=66
; 1 = the sensors also run in combat (default 0: only out of combat, to keep the game light)
EnvInCombat=0
; Detection distance in front: walking / sprinting (RaySense: 230 / 330)
EnvWalkDistance=230
EnvSprintDistance=330

; ---------------------------------------------------------------- 0.22.0
; Sensor mode: 0 = light (weak PC, default), 1 = normal, 2 = powerful. Changes how often the environment is read:
; forward/jump group 20 / 30 / 50 times per second (only while moving), ground and walls every 150-200 / 100-150 / 60-100 ms.
EnvPerformance=0
; 1 = at load, read the OAR config.json files and run only the sensor groups the animations really use (walls, beam, ground...). Default 1.
EnvDemandScan=1
; Time (ms) the highest obstacle height read is kept, so one low reading at the moment of the jump does not spoil it. Range 0-1000.
EnvHoldMs=300

; ---------------------------------------------------------------- 0.23.0
; Performance: EnvPerformance (above) now also sets the minimum interval of the fast threads: rotation 4 / 2 / 1 ms, hold and movement 3 / 2 / 1 ms
; (light / normal / powerful). UpdateMilliseconds still applies if it is larger. The log gets a "perf:" line every 10 s with the CPU share of each thread.
; Obstacle jump: obstacles closer than this distance (units) are left to FreeRun (climbing); the obstacle jump only applies from this distance up to the detection distance.
ObstacleJumpMinDistance=70
; 1 = obstacle jumps are higher: while an obstacle of JumpObstacleMin or more is in front, the game's jump height setting (fJumpHeightMin) is raised to
; (obstacle height + clearance) and restored afterwards. Normal jumps are not changed. Default 1.
ObstacleJumpBonus=1
; Extra height above the top of the obstacle (units), and the largest multiplier of the normal jump height
ObstacleJumpClearance=25
ObstacleJumpMaxMult=2.5
; 1 = the Keytrace mask is only computed with a weapon drawn AND a locked target (lock-on). 0 = always (as before). Default 1.
KeytraceCombatOnly=1

; ---- 0.23.1 ----
; Em combate (lock ativo ou sessao de combate) as threads de giro/movimento correm sempre a 1 ms,
; independentemente de EnvPerformance. Fora de combate vale o modo (0 leve, 1 normal, 2 potente).
; Os sensores RaySense (EnvProbe e restantes chaves Env*/ObstacleJump*) agora tem pagina propria no menu MCM: "Ambiente (RaySense)".
