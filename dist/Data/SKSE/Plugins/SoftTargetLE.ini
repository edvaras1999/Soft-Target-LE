; SoftTarget LE v0.13.2 - settings
; Most options can be changed in-game: MCM > SoftTarget. Edit by hand only for what the menu lacks.
; After editing by hand, the file is re-read by itself within a second.

[SoftTarget]
Enabled=1
LogOnly=0
Verbose=0
Probe=0

; ---------------------------------------------------------------- Lock-On (replaces Simple Lock-On: do not use both)
LockEnabled=1
; Keys: keyboard scan codes (33 = F). Mouse buttons are 256 + button (258 = M3, the middle button).
LockKey=33
LockSwitchKey=258
; How far a target can be locked and followed
LockRange=2000
; The enemy whose body (any bone: head, legs, wings, tail) is closest to the crosshair is locked,
; as long as it is within this many degrees of the crosshair
LockAcquireDegrees=30
LockHostileOnly=1
; The lock turns off when the target stays out of view (further than LockLoseAngleDegrees from the screen center) this long
LockLoseSightMs=1500
LockLoseAngleDegrees=75
; When the target dies, go to the nearest enemy
LockAutoNext=1
; 1 = the automatic choice (next enemy when the target dies) only picks enemies that are in combat. The manual lock (F) still takes whatever is at the screen center.
LockAutoCombatOnly=1
; Automatic choice (auto-next, nearest enemy): anyone inside LockAutoCircleRange counts in ANY direction (even behind you);
; further away, up to LockRange, only enemies inside the forward cone (LockAutoConeDegrees = degrees to EACH side of the screen center)
LockAutoCircleRange=900
LockAutoConeDegrees=60
; Which axis of the camera matrix points forward (0..11). 1 = Y column, confirmed in the logs. Do not change unless the lock aims wrongly.
LockCameraAxis=1
; The camera follows the target (both profiles; in the FreeCam / Coeus profile through the camera offset)
LockCameraFollow=0
; FreeCam / Coeus profile: while a bow/crossbow is drawn with the lock on, the camera centers the target (so AIM Fix arrows hit). 1 = on.
BowLockCamera=1
LockCameraPitch=1
LockCameraSmooth=5
; Camera stability (normal profile): the aim point is averaged over this many milliseconds, so the target's weapon swings and arm
; movements do not shake the camera. 0 = off. Higher = steadier but slower to follow.
AimFilterMs=600
; Dead zone, in degrees: the camera ignores errors smaller than this (0 = off).
CameraDeadZoneDegrees=3.5

; ---------------------------------------------------------------- Where SoftTarget works (0.13.2)
; 1 = no automatic body turning in first person (aim fully manual; the lock-on still works if you turn it on).
NoSoftTargetFirstPerson=1
; 1 = no automatic body turning with a bow / crossbow (the game camera is used; the lock-on still works if you turn it on).
NoSoftTargetBow=1

; ---------------------------------------------------------------- Bow camera (both profiles)
; OFF by default (so it does not clash with other bow camera mods). When on: while you draw a bow / crossbow the camera moves to the shoulder (third-person shooter style) and goes back when you release.
BowShoulder=0
; 1 = right shoulder, 0 = left. The swap key (below) changes it while drawing and saves it here.
BowShoulderRight=1
; Sideways offset (0..120), forward (+) / back (-) and height, added to your normal camera offsets (game units).
BowShoulderX=40
BowShoulderY=0
BowShoulderZ=10
; Key that swaps shoulder while the bow is drawn (18 = E; 0 = none). Note: E is also the default Activate key.
BowShoulderSwapKey=18

; ---------------------------------------------------------------- Aim point height (lock-on and SoftTarget)
; Humans are aimed at the chest bone (stable); creatures at the middle of the body. This adds a manual adjustment, in game units (-60..60).
; In combat (lock-on or SoftTarget active): Shift + mouse wheel up/down changes it by 3 units per notch (it is saved here automatically).
; If the wheel also zooms the camera, use the keys below instead (Page Up / Page Down; 0 = unused).
AimHeightAdjust=0
AimAdjustWheel=1
AimAdjustUpKey=201
AimAdjustDownKey=209

; ---------------------------------------------------------------- Shot prediction (only with the lock-on)
PredictEnabled=1
; Bow / crossbow arrow speed used to compute the lead (units per second). Spells use the speed in the game data (UseSpellDataSpeed=1)
; or SpellProjectileSpeed if the game data has none.
ProjectileSpeed=4500
SpellProjectileSpeed=2500
UseSpellDataSpeed=1
; Fine tuning of all projectile speeds, %. Shots land BEHIND a moving target -> lower it; land IN FRONT of it -> raise it.
ProjectileSpeedScale=100
; Raises the aim to compensate for the drop at long distance. 0 = no compensation.
ProjectileGravity=470
PredictStrength=100
PredictMinDistance=150

; ---------------------------------------------------------------- SoftTarget (body follows the nearest enemy while you attack)
RequireCombat=1
UseHostileList=1
; Shape: 0 = cone in front, 1 = circle (360)
Shape=1
Range=450
ConeDegrees=140
MaxHeightDifference=600
SwitchMarginPercent=20

; Body turning
TurnSpeedDegPerSec=900
Smoothing=15
UpdateMilliseconds=1
TapAssist=1
; HoldFaceButton: 0 off, 1 left (M2), 2 right (M1), 3 both
HoldFaceButton=3
RetargetMilliseconds=80
; HoldMilliseconds: keep facing after an attack (ms)
HoldMilliseconds=3000
ReturnToHeading=0
ReturnSpeedDegPerSec=360
ReturnSmoothing=3
; FreeCam / Coeus profile: attacks turn the body toward the enemy for this long (ms) while walking, 0 = never
AttackPulseMs=350

; ProfileMode: 0 = normal (Coeus off, or Coeus with EnableUnsheathed=0), 1 = FreeCam / Coeus (Coeus directional movement with weapons drawn, EnableUnsheathed=1)
ProfileMode=1
; Accept enemies in the reanimate life state
AllowReanimated=1

; External lock-on (LockOn.dll), only if you still use it: 0 pause SoftTarget while locked on, 1 body only, 2 pause + switch to the nearest
LockOnKey=0
LockOnMode=0
LockOnSwitchKey=0
; CoeusYield: no longer used (0.12.3). In the FreeCam / Coeus profile Coeus is never asked to let go: that also released the free camera.
CoeusYield=0
; FreeCam / Coeus profile, input rotation: the body keeps facing the target (lock-on or SoftTarget) while you walk, and the walking
; direction stays relative to the SCREEN (W = up on the screen, A = left, ...). Keyboard only. The plugin finds the game's movement
; vector when you ask it to (Shift+F10, or the button in the menu: then press W, A, S, D one at a time). 0 = off.
MoveRemap=1
; First place found by the learning (kept for reference; the full list is MoveVecList below).
MoveVecRegion=0
MoveVecOffset=20
; Written by the learning (several places can hold the same vector). Format region:offset:swapped,...  Empty = not learned yet.
MoveVecList=0:20:0
; Learning: press Shift + this key (68 = F10) or the button in the menu, then press W, A, S, D one at a time for ~15 s.
MoveLearnKey=68
; (The plugin saves the two values above by itself once it finds the vector with no doubt. To search again, set MoveVecRegion=-1.)
; FreeCam / Coeus profile: sprinting does not release the aim or the lock-on (sprint attacks). 0 = sprinting ends the SoftTarget.
SprintKeepsAim=1
; Normal profile, lock-on camera: where the target sits relative to the crosshair, in degrees (-20..20). For mods that move the aim point
; (AIM FIX, camera offset). X > 0 = target to the right of the centre, Y > 0 = above the centre. 0 = centred.
AimOffsetX=0
AimOffsetY=0
; FreeCam / Coeus profile: when this mod turns the body, the camera stays still (camera offset compensated) and the mouse keeps moving only the camera
CameraHoldTdm=1
; Create the handle of targets the game does not list as hostile (Coeus needs it for its external lock-on query). Set 0 if the game crashes at the first lock.
CreateHandles=1

; Vertical aim (spells and melee): 0 off, 1 tilt the body only (the camera is not touched by this option)
VerticalMode=1
AimHeight=100
PlayerAimHeight=110
VerticalInvert=0
VerticalLimitDegrees=45

; Extra buttons (keyboard scan codes, comma separated, up to 8)
; ExtraTapKeys: R - charged attack mod
ExtraTapKeys=19
; ExtraHoldKeys: X - dual-wield block mod
ExtraHoldKeys=45

; Menu language: 0 = English, 1 = Portugues
Language=0

; Keys that count as Shift (sprinting with the lock-on does not pull the body toward the target), keyboard scan codes: 42 = left Shift, 54 = right Shift
ShiftKeys=42,54

; ---------------------------------------------------------------- On-screen indicator (dot)
DotLock=1
DotSoftTarget=1
; DotSkin: 0 = dot, 1 = ring and dot (both drawn by the plugin), 2 = Simple Lock-On reticle (LockOnReticle.swf or LockOnMenu.swf in Data\Interface),
;          3 = Coeus-style reticle (TDM_Widgets.swf + TDM_Assets0.swf in Data\Interface or Data\Interface\TrueDirectionalMovement)
DotSkin=3
; DotColor (drawn skins): 0 white, 1 red, 2 yellow, 3 cyan, 4 green, 5 orange
DotColor=0
DotSize=100
DotOpacity=100
DotTdmType=1
