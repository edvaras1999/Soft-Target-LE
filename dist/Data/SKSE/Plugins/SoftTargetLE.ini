; SoftTarget LE v0.12.0 - settings
; Most options can be changed in-game: MCM > SoftTarget. Edit by hand only for what the menu lacks.
; After editing by hand, the file is re-read by itself within a second.

[SoftTarget]
Enabled=1
LogOnly=0
Verbose=0
Probe=0

; ---------------------------------------------------------------- Lock-On (replaces Simple Lock-On: do not use both)
LockEnabled=1
; Keys: keyboard scan codes (33 = F). Mouse buttons are 256 + button (258 = M3, the middle button).
LockKey=33
LockSwitchKey=258
; How far a target can be locked and followed
LockRange=4000
; The enemy whose body (any bone: head, legs, wings, tail) is closest to the crosshair is locked,
; as long as it is within this many degrees of the crosshair
LockAcquireDegrees=30
LockHostileOnly=1
; The lock turns off when the target stays out of view (further than LockLoseAngleDegrees from the screen center) this long
LockLoseSightMs=1500
LockLoseAngleDegrees=75
; When the target dies, go to the nearest enemy
LockAutoNext=1
; Automatic choice (auto-next, nearest enemy): anyone inside LockAutoCircleRange counts in ANY direction (even behind you);
; further away, up to LockRange, only enemies inside the forward cone (LockAutoConeDegrees = degrees to EACH side of the screen center)
LockAutoCircleRange=900
LockAutoConeDegrees=60
; Which axis of the camera matrix points forward (0..11). 1 = Y column, confirmed in the logs. Do not change unless the lock aims wrongly.
LockCameraAxis=1
; The camera follows the target (both profiles; in the TDM profile through the camera offset)
LockCameraFollow=1
LockCameraPitch=1
LockCameraSmooth=8

; ---------------------------------------------------------------- Shot prediction (only with the lock-on)
PredictEnabled=1
; Speed used to compute the lead (units per second). Arrows are fast, many spells are slower.
ProjectileSpeed=4500
; Raises the aim to compensate for the drop at long distance. 0 = no compensation.
ProjectileGravity=0
PredictStrength=100
PredictMinDistance=400

; ---------------------------------------------------------------- SoftTarget (body follows the nearest enemy while you attack)
RequireCombat=1
UseHostileList=1
; Shape: 0 = cone in front, 1 = circle (360)
Shape=0
Range=450
ConeDegrees=140
MaxHeightDifference=600
SwitchMarginPercent=0

; Body turning
TurnSpeedDegPerSec=900
Smoothing=0
UpdateMilliseconds=8
TapAssist=1
; HoldFaceButton: 0 off, 1 left (M2), 2 right (M1), 3 both
HoldFaceButton=3
RetargetMilliseconds=80
; HoldMilliseconds: keep facing after an attack (ms)
HoldMilliseconds=3000
ReturnToHeading=0
ReturnSpeedDegPerSec=360
ReturnSmoothing=3
; TDM profile: attacks turn the body toward the enemy for this long (ms) while walking, 0 = never
AttackPulseMs=350

; ProfileMode: 0 = normal (TDM off, or Coeus with EnableUnsheathed=0), 1 = TDM (Coeus directional movement with weapons drawn, EnableUnsheathed=1)
ProfileMode=0
; Accept enemies in the reanimate life state
AllowReanimated=1

; External lock-on (LockOn.dll), only if you still use it: 0 pause SoftTarget while locked on, 1 body only, 2 pause + switch to the nearest
LockOnKey=0
LockOnMode=0
LockOnSwitchKey=0
; CoeusYield (TDM profile): 0 = Coeus keeps the body while you walk (default); 1 = during the combat window / lock-on the character faces the enemy and walks relative to that facing. Both work.
CoeusYield=0
; TDM profile: when this mod turns the body, the camera stays still (camera offset compensated) and the mouse keeps moving only the camera
CameraHoldTdm=1
; Create the handle of targets the game does not list as hostile (Coeus needs it for CoeusYield). Set 0 if the game crashes at the first lock.
CreateHandles=1

; Vertical aim (spells and melee): 0 off, 1 tilt the body only (the camera is not touched by this option)
VerticalMode=1
AimHeight=100
PlayerAimHeight=110
VerticalInvert=0
VerticalLimitDegrees=45

; Extra buttons (keyboard scan codes, comma separated, up to 8)
; ExtraTapKeys: R - charged attack mod
ExtraTapKeys=19
; ExtraHoldKeys: X - dual-wield block mod
ExtraHoldKeys=45

; Menu language: 0 = English, 1 = Portugues
Language=0

; Keys that count as Shift (sprinting with the lock-on does not pull the body toward the target), keyboard scan codes: 42 = left Shift, 54 = right Shift
ShiftKeys=42,54

; ---------------------------------------------------------------- On-screen indicator (dot)
DotLock=1
DotSoftTarget=0
; DotSkin: 0 = dot, 1 = ring and dot (both drawn by the plugin), 2 = Simple Lock-On reticle (LockOnReticle.swf or LockOnMenu.swf in Data\Interface),
;          3 = TDM reticle (Data\Interface\TrueDirectionalMovement\TDM_Widgets.swf + TDM_Assets0.swf)
DotSkin=1
; DotColor (drawn skins): 0 white, 1 red, 2 yellow, 3 cyan, 4 green, 5 orange
DotColor=0
DotSize=100
DotOpacity=100
DotTdmType=0
