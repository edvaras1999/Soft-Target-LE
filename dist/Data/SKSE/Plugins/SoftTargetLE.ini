[SoftTarget]
; 1 = ligado, 0 = desligado
Enabled=1
; 1 = so escreve no log (SoftTargetLE.log) quem seria o alvo, sem virar o personagem
LogOnly=0
; Alcance maximo em unidades do jogo (140 = ~2 metros)
